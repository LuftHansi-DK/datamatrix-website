ht="600" fill="#0B1F3A" opacity=".7">Fre</text><text x="334" y="191" text-anchor="middle" font-family="Fraunces Variable,Georgia,serif" font-style="italic" font-size="24" fill="#0B1F3A">?</text><rect x="370" y="150" width="52" height="64" rx="9" fill="#fff" stroke="#0B1F3A" stroke-width="2.2"/><text x="396" y="140" text-anchor="middle" font-family="Inter Variable,Inter,sans-serif" font-size="13" font-weight="600" fill="#0B1F3A" opacity=".7">Lør</text><path class="draw" style="--l:36;animation-delay:1.25s" d="M385 182 l8 8 l15 -17" fill="none" stroke="#2F6FDB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="432" y="150" width="52" height="64" rx="9" fill="#fff" stroke="#0B1F3A" stroke-width="2.2"/><text x="458" y="140" text-anchor="middle" font-family="Inter Variable,Inter,sans-serif" font-size="13" font-weight="600" fill="#0B1F3A" opacity=".7">Søn</text><path class="draw" style="--l:36;animation-delay:1.50s" d="M447 182 l8 8 l15 -17" fill="none" stroke="#2F6FDB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
