 <path class="flow" d="M110 140 C150 150 160 180 190 195 M140 185 C160 190 170 195 190 200 M100 245 C140 240 160 220 190 208" fill="none" stroke="#8FB8FF" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 7"/>
