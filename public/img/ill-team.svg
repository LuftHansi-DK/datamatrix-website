 <!-- documentation sheet handed over -->
 <g transform="translate(330 270) rotate(-8)"><g class="bob"><path d="M0 0 h36 l10 10 v40 h-46 z" fill="#fff" stroke="#0B1F3A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 18 h28 M8 28 h22 M8 38 h26" stroke="#0B1F3A" stroke-width="2" stroke-linecap="round" opacity=".5"/></g></g>
