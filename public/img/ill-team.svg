 <circle cx="440" cy="120" r="42" fill="#fff" stroke="#0B1F3A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(440 122) scale(0.8)"><circle cx="0" cy="-14" r="16" fill="#fff" stroke="#0B1F3A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M-28 40 c4 -22 14 -32 28 -32 c14 0 24 10 28 32 z" fill="#FDE7C4" stroke="#0B1F3A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
